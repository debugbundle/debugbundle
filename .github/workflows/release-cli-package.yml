name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: CLI stable version to publish (for example 0.1.0)
        required: true
        type: string
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#cli-v}"
          fi

          if [[ -z "$version" ]]; then
            echo "missing_version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check published CLI release state
        id: published_state
        run: |
          node --input-type=module <<'EOF'
          const releaseVersion = process.env.RELEASE_VERSION;
          const githubOutput = process.env.GITHUB_OUTPUT;

          if (!releaseVersion) {
            throw new Error("missing_release_version");
          }

          if (!githubOutput) {
            throw new Error("missing_github_output");
          }

          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent("@debugbundle/cli")}/${releaseVersion}`);

          const { appendFileSync } = await import("node:fs");

          if (response.status === 404) {
            appendFileSync(githubOutput, "state=none\n");
            process.exit(0);
          }

          if (!response.ok) {
            throw new Error(`failed_to_check_cli_${response.status}`);
          }

          appendFileSync(githubOutput, "state=all\n");
          EOF
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}

      - name: Note already published CLI release
        if: steps.published_state.outputs.state == 'all'
        run: echo "Release version ${{ steps.release_version.outputs.value }} is already published for @debugbundle/cli; skipping publish steps."

      - name: Validate CLI release manifest
        run: |
          node --input-type=module <<'EOF'
          import { existsSync, readFileSync } from "node:fs";
          import { join } from "node:path";

          const expectedVersion = process.env.RELEASE_VERSION;
          const manifest = JSON.parse(readFileSync("apps/cli/release-manifest.json", "utf8"));
          const packageJson = JSON.parse(readFileSync("apps/cli/package.json", "utf8"));

          if (!expectedVersion) {
            throw new Error("missing_release_version");
          }

          if (manifest.package !== packageJson.name) {
            throw new Error("manifest_package_mismatch");
          }

          if (manifest.sourceDirectory !== "apps/cli") {
            throw new Error(`unexpected_source_directory:${manifest.sourceDirectory}`);
          }

          if (manifest.tagPrefix !== "cli-v") {
            throw new Error(`unexpected_tag_prefix:${manifest.tagPrefix}`);
          }

          if (manifest.npmTag !== "latest") {
            throw new Error(`unexpected_npm_tag:${manifest.npmTag}`);
          }

          if (packageJson.version !== expectedVersion) {
            throw new Error(`package_version_mismatch:${packageJson.version}:${expectedVersion}`);
          }

          if (expectedVersion.includes("-")) {
            throw new Error(`unexpected_prerelease_version:${expectedVersion}`);
          }

          for (const fileName of manifest.requiredReleaseFiles) {
            if (!existsSync(join(manifest.sourceDirectory, fileName))) {
              throw new Error(`missing_release_file:${fileName}`);
            }
          }
          EOF
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}

      - name: Run focused CLI package tests
        run: pnpm vitest run tests/apps/cli/cli-workspace-package.test.ts

      - name: Pack CLI artifact
        if: steps.published_state.outputs.state == 'none'
        run: |
          rm -rf .tmp/cli-release
          mkdir -p .tmp/cli-release
          npm pack ./apps/cli --pack-destination .tmp/cli-release

      - name: Smoke test packed CLI install
        if: steps.published_state.outputs.state == 'none'
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/package.json" <<'EOF'
          {
            "name": "debugbundle-cli-release-smoke",
            "private": true
          }
          EOF

          npm install --prefix "$tmpdir" --no-package-lock \
            "$PWD/.tmp/cli-release/debugbundle-cli-${RELEASE_VERSION}.tgz"

          "$tmpdir/node_modules/.bin/debugbundle" --help >/dev/null
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}

      - name: Publish CLI package
        if: steps.published_state.outputs.state == 'none'
        run: npm publish ./apps/cli --tag latest --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Smoke test published CLI package
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if npm view "@debugbundle/cli@${RELEASE_VERSION}" version >/dev/null 2>&1; then
              break
            fi

            if [[ "$attempt" == "30" ]]; then
              echo "@debugbundle/cli@${RELEASE_VERSION} not visible on npm after propagation wait" >&2
              npm view "@debugbundle/cli@${RELEASE_VERSION}" version
              exit 1
            fi

            sleep 10
          done

          npm view "@debugbundle/cli@${RELEASE_VERSION}" version

          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/package.json" <<'EOF'
          {
            "name": "debugbundle-cli-registry-smoke",
            "private": true
          }
          EOF

          npm install --prefix "$tmpdir" --no-package-lock "@debugbundle/cli@${RELEASE_VERSION}"
          "$tmpdir/node_modules/.bin/debugbundle" --help >/dev/null
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}