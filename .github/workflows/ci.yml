name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: pnpm test

      - name: Build
        run: pnpm build

  gemini-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Package standalone extension
        run: make gemini-extension-package

      - name: Validate archive
        run: unzip -t .tmp/gemini-extension/*.zip

      - name: Native Gemini CLI smoke
        run: make gemini-extension-smoke GEMINI_SMOKE_NODE_IMAGE=node:${{ matrix.node-version }}-bookworm
