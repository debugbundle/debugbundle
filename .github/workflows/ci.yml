name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: debugbundle
          POSTGRES_PASSWORD: debugbundle
          POSTGRES_DB: debugbundle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debugbundle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: node scripts/dependency-audit.mjs --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          PROJECT_SERVICE_DB_COVERAGE: isolated
          DB_HOST: 127.0.0.1
          DB_USER: debugbundle
          DB_PASSWORD: debugbundle
          DB_NAME: debugbundle
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: pnpm test

      # Database regressions are included in pnpm test's isolated coverage
      # shards. PDF text extraction needs Poppler, without any provider key.
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Smart Report PDF regressions
        env:
          REPORT_PDF_TEXT_CHECK_REQUIRED: "true"
        run: pnpm exec vitest run tests/packages/smart-reports/report-pdf.test.ts tests/packages/smart-reports/report-pdf-child.test.ts tests/packages/smart-reports/report-html.test.ts

      - name: Build
        run: pnpm build

  gemini-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Package standalone extension
        run: make gemini-extension-package

      - name: Validate archive
        run: unzip -t .tmp/gemini-extension/*.zip

      - name: Native Gemini CLI smoke
        run: make gemini-extension-smoke GEMINI_SMOKE_NODE_IMAGE=node:${{ matrix.node-version }}-bookworm
