name: DebugBundle Temporary Dispatch Validation

on:
  repository_dispatch:
    types: [debugbundle.incident]

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record the dispatch payload
        env:
          DEBUGBUNDLE_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s\n' "$DEBUGBUNDLE_PAYLOAD" > dispatch-payload.json
          cat dispatch-payload.json

      - name: Upload the dispatch payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debugbundle-dispatch-payload
          path: dispatch-payload.json
