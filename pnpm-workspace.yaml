packages:
  - 'apps/*'
  - 'packages/*'
confirmModulesPurge: false
allowBuilds:
  '@google/genai': false
  esbuild: true
  msw: true
  openclaw: false
  protobufjs: false
  tree-sitter-bash: false
minimumReleaseAgeExclude:
  - '@debugbundle/*'
# Apply minimum patched versions to audited vulnerable dependency ranges.
overrides:
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': 1.31.0
  'fastify@>=5.0.0 <5.12.2': 5.12.2
  'undici@>=8.0.0 <8.10.2': 8.10.2
  'vite@>=8.0.0 <8.0.16': 8.0.16
  'react-router@>=7.0.0 <7.18.2': 7.18.2
  'fast-xml-builder@<1.1.7': 1.1.7
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'brace-expansion@>=1.0.0 <1.1.20': 1.1.20
  'brace-expansion@>=3.0.0 <5.0.11': 5.0.11
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'tar@>=7.0.0 <7.5.21': 7.5.21
  'hono@>=4.0.0 <4.12.25': 4.12.25
  'fast-uri@>=3.0.0 <3.1.7': 3.1.7
