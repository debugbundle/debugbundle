server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    add_header Cache-Control "no-store" always;
    error_page 404 /404.html;

    # Share links land on the homepage, where the site validates the offer hint.
    location ~ "^/r/(?<referral_code>(?=[A-Za-z0-9-]{3,24}/?$)[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*)/?$" {
        return 302 /?offer=$referral_code&referral_visit=$referral_code;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
